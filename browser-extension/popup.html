<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Owen Browser Bridge Agent</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Owen Browser Bridge Agent</h1>
        <span id="status" aria-live="polite">Passive</span>
      </header>

      <p class="agent-note">VS Code controls the active browser tab after pairing. Keep this extension enabled; no manual tab sending is required.</p>

      <dl class="agent-meta">
        <div><dt>Agent</dt><dd id="agentId">Loading...</dd></div>
        <div><dt>Bridge</dt><dd id="connectionStatus">Unknown</dd></div>
      </dl>

      <button id="grantSite" type="button">Grant current site access</button>

      <label>
        VS Code Port
        <input id="port" type="number" min="1024" max="65535" value="17321">
      </label>

      <label>
        Pairing Token
        <input id="token" type="password" autocomplete="off" placeholder="Paste token from VS Code">
      </label>

      <label>
        Investigation / Case
        <input id="investigationName" type="text" autocomplete="off" placeholder="Optional, e.g. incident-12345">
      </label>

      <label class="row">
        <input id="includeScreenshot" type="checkbox" checked>
        <span>Include screenshot</span>
      </label>

      <label>
        Screenshot redaction
        <select id="screenshotRedaction">
          <option value="standard">Standard</option>
          <option value="strict">Strict</option>
          <option value="off">Off</option>
        </select>
      </label>

      <label class="row">
        <input id="includeHtml" type="checkbox">
        <span>Include HTML snapshot</span>
      </label>

      <label class="row">
        <input id="commandPolling" type="checkbox" checked>
        <span>Accept Copilot browser actions</span>
      </label>

      <button id="save" type="button">Save Settings</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
