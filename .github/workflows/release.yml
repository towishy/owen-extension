name: Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v' + pkg.version) { throw new Error('Tag ' + tag + ' does not match package version v' + pkg.version); }"

      - name: Build and verify release assets
        run: npm run release:check

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="dist/owen-browser-bridge-${VERSION}.vsix"
          BROWSER_ZIP="dist/owen-browser-capture-browser-extension-${VERSION}.zip"
          TAG="v${VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${VSIX}" "${BROWSER_ZIP}" --clobber
          else
            gh release create "${TAG}" "${VSIX}" "${BROWSER_ZIP}" --title "Owen Browser Bridge ${TAG}" --generate-notes
          fi