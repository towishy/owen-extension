name: Release Assets

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== pkg.version) { throw new Error('Tag ' + tag + ' does not match package version ' + pkg.version); }"

      - name: Build and verify release assets
        run: xvfb-run -a npm run release:check

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local attempt=1
            local max_attempts=12
            until "$@"; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Command failed on attempt ${attempt}; retrying in 30 seconds: $*" >&2
              attempt=$((attempt + 1))
              sleep 30
            done
          }

          VERSION=$(node -p "require('./package.json').version")
          VSIX="dist/owen-browser-bridge-${VERSION}.vsix"
          BROWSER_ZIP="dist/owen-browser-capture-browser-extension-${VERSION}.zip"
          CHECKSUMS="dist/SHA256SUMS.txt"
          TAG="${VERSION}"

          ensure_release() {
            local output
            if output=$(gh release view "${TAG}" 2>&1); then
              return 0
            fi
            if echo "${output}" | grep -qi "release not found"; then
              gh release create "${TAG}" --draft --title "${VERSION}" --generate-notes
              return
            fi
            echo "${output}" >&2
            return 1
          }

          retry ensure_release
          retry gh release upload "${TAG}" "${VSIX}" "${BROWSER_ZIP}" "${CHECKSUMS}" --clobber
          retry gh release edit "${TAG}" --draft=false --latest

      - name: Retain only the current release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local attempt=1
            local max_attempts=12
            until "$@"; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Command failed on attempt ${attempt}; retrying in 30 seconds: $*" >&2
              attempt=$((attempt + 1))
              sleep 30
            done
          }

          VERSION=$(node -p "require('./package.json').version")
          CURRENT_TAG="${VERSION}"

          RELEASE_TAGS=$(retry gh release list --limit 1000 --json tagName --jq '.[].tagName')
          while IFS= read -r RELEASE_TAG; do
            if [ -n "${RELEASE_TAG}" ] && [ "${RELEASE_TAG}" != "${CURRENT_TAG}" ]; then
              retry gh release delete "${RELEASE_TAG}" --yes
            fi
          done <<< "${RELEASE_TAGS}"

          git ls-remote --tags --refs origin | awk '{ sub("refs/tags/", "", $2); print $2 }' | while IFS= read -r REMOTE_TAG; do
            if [ -n "${REMOTE_TAG}" ] && [ "${REMOTE_TAG}" != "${CURRENT_TAG}" ]; then
              retry git push origin --delete "${REMOTE_TAG}"
            fi
          done

          RELEASES=$(retry gh release list --limit 1000 --json tagName --jq '.[].tagName')
          TAGS=$(git ls-remote --tags --refs origin | awk '{ sub("refs/tags/", "", $2); print $2 }')
          [ "${RELEASES}" = "${CURRENT_TAG}" ] || { echo "Expected only release ${CURRENT_TAG}, found: ${RELEASES}"; exit 1; }
          [ "${TAGS}" = "${CURRENT_TAG}" ] || { echo "Expected only tag ${CURRENT_TAG}, found: ${TAGS}"; exit 1; }